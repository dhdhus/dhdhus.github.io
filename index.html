<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dhdhus</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: monospace;
    }

    /* 上栏 */
    .topbar {
      display: flex;
      border-bottom: 2px solid #000;
    }
    .tab {
      flex: 1;
      padding: 6px 6px;
      font-size: 24px;
      line-height: 32px;
      font-family: inherit;
      text-align: center;
      background: #fff;
      color: #000;
      border: none;
      border-right: 2px solid #000;
      cursor: pointer;
      user-select: none;
    }
    .tab:last-child { border-right: none; }
    .tab.active {
      background: #000;
      color: #fff;
    }

    /* 下方内容区 */
    .panel {
      display: none;
      padding: 48px 24px;
      font-size: 24px;
      line-height: 36px;
      text-align: center;
    }
    .panel.active { display: block; }
    .about-photo {
  display: block;
  margin: 24px auto;        /* 上下 24px，左右自动 → 水平居中 */
  max-width: 100%;          /* 不超过父容器宽度 */
  width: 500px;             /* 想更小就改这个，12 的整数倍 */
  height: auto;             /* 保持比例，不拉伸 */
  border: 0px solid #000;
  image-rendering: pixelated;
}
  </style>
<meta name="generator" content="Hexo 8.1.2"></head>
<body>

  <nav class="topbar">
    <button class="tab active" data-tab="posts">我的文章</button>
    <button class="tab" data-tab="about">关于我自己</button>
  </nav>

  <section class="panel active" id="panel-posts">
    <img src="images\KAngel.jpg" alt=""class="about-photo">
    欢迎来到我的博客，但是这里暂时什么都没有
  </section>

  <section class="panel" id="panel-about">
    我只是一个普通的大专生
  </section>

  <script>
    document.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (b) {
          b.classList.remove('active');
        });
        document.querySelectorAll('.panel').forEach(function (p) {
          p.classList.remove('active');
        });
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });
  </script>

</body>
</html>
